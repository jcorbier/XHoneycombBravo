[package]
name = "honeycomb-bravo-xplane"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = [
    "Jeremie Corbier <jeremie.corbier@gmail.com>",
    "Jonas Lalin <1ac6df24@gmail.com>",
]
description = "X-Plane 12 plugin for the Honeycomb Bravo throttle quadrant (LEDs, rotary encoder, trim wheel, thrust reversers)"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
xplm = "0.4.2"
xplm-sys = "0.5.1"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

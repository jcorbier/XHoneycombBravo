[package]
name = "honeycomb-bravo-xplane"
version = "0.2.1"
edition = "2021"
authors = ["Jeremie Corbier"]
description = "X-Plane 12 plugin for the Honeycomb Bravo throttle quadrant (LEDs, rotary encoder, trim wheel, thrust reversers)"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
xplm = "0.4.2"
xplm-sys = "0.5.1"
hidapi = { version = "2.6", features = ["macos-shared-device"] }
rusb = "0.9"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

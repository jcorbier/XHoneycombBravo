name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build for x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p output
          lipo -create -output output/mac.xpl \
            target/x86_64-apple-darwin/release/libhoneycomb_bravo_xplane.dylib \
            target/aarch64-apple-darwin/release/libhoneycomb_bravo_xplane.dylib

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Codesign Universal Binary
        run: |
          echo "Signing output/mac.xpl with Developer ID Application and Hardened Runtime..."
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" \
            output/mac.xpl
          codesign --verify --verbose output/mac.xpl

      - name: Prepare Release Archive
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p release_artifact/XHoneycombBravo
          cp output/mac.xpl release_artifact/XHoneycombBravo/
          cp README.md release_artifact/XHoneycombBravo/
          cp CHANGELOG.md release_artifact/XHoneycombBravo/
          sed -i '' "s/@VERSION@/${TAG_NAME}/" skunkcrafts_updater.cfg
          cp skunkcrafts_updater.cfg release_artifact/XHoneycombBravo/
          cd release_artifact
          zip -r ../XHoneycombBravo-${TAG_NAME}.zip XHoneycombBravo

      - name: Notarize Release Archive
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Setting up Apple API Key..."
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          echo "Submitting XHoneycombBravo-${TAG_NAME}.zip to Apple Notary Service..."
          xcrun notarytool submit "XHoneycombBravo-${TAG_NAME}.zip" \
            --key "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

      - name: Create Skunkcrafts Updater package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          unzip XHoneycombBravo-${TAG_NAME}.zip
          mv XHoneycombBravo release

          echo "" > release/skunkcrafts_updater_blacklist.txt

          # create crc32 checksum for all values and write to skunkcrafts_updater_whitelist.txt
          # format is <filename>|<crc32 checksum>
          # include subdirectories
          find release -type f ! \( -name '*skunkcrafts_updater*' -o -path '*skunkcrafts_updater*' \) -print0 | while IFS= read -r -d '' file; do
            checksum_hex=$(crc32 "$file")
            # Convert hex checksum to uint32 decimal
            checksum_decimal=$((16#$checksum_hex))
            # Remove "release/" prefix from $file
            modified_file="${file#release/}"
            echo "$modified_file|$checksum_decimal" >> release/skunkcrafts_updater_whitelist.txt
          done

          git checkout -b release
          git add release
          git commit -m "new release - ${TAG_NAME}"
          git push -f -u origin release
                    
      - name: Extract Release Notes
        id: extract_release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NO_V=${VERSION#v}
          # Extract the section for this version.
          awk "/^## \[${VERSION_NO_V}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md

          # If empty (e.g. tag doesn't match changelog), fallback to simple text
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${VERSION}" > RELEASE_NOTES.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: XHoneycombBravo-*.zip
          body_path: RELEASE_NOTES.md

      - name: Cleanup Keychain & API Keys
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ~/.private_keys

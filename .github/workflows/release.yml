name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install hidapi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build for x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p output
          lipo -create -output output/mac.xpl \
            target/x86_64-apple-darwin/release/libhoneycomb_bravo_xplane.dylib \
            target/aarch64-apple-darwin/release/libhoneycomb_bravo_xplane.dylib

      - name: Prepare Release Archive
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p release_artifact/XHoneycombBravo
          cp output/mac.xpl release_artifact/XHoneycombBravo/
          cp README.md release_artifact/XHoneycombBravo/
          cd release_artifact
          zip -r ../XHoneycombBravo-${TAG_NAME}.zip XHoneycombBravo

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: XHoneycombBravo-*.zip
